syntax = "proto3";

package user.v1;

option go_package = "demo-shop/api/gen/user/v1;v1_userv1";

import "user/v1/permission.proto";
import "user/v1/role.proto";
import "user/v1/menu.proto";
import "user/v1/dept.proto";
import "user/v1/scope.proto";
import "user/v1/role_perm.proto";
import "user/v1/role_menu.proto";
import "user/v1/menu_perm.proto";
import "user/v1/user_role.proto";
import "user/v1/user_dept.proto";


// RBACService 平台 RBAC 管理。表的所有权在 user-service
service RBACService {
  // ---- 判权数据源 ----
  rpc ListPermCodesByUserId(ListPermCodesByUserIdReq) returns (ListPermCodesByUserIdResp);
  rpc ListPermCodesByApi(ListPermCodesByApiReq) returns (ListPermCodesByApiResp);
  rpc GetPermVersion(GetPermVersionReq) returns (GetPermVersionResp);

  // ---- 权限点管理 ----
  rpc GetPermission(GetPermissionReq) returns (GetPermissionResp);
  rpc ListPermissions(ListPermissionsReq) returns (ListPermissionsResp);
  rpc CreatePermission(CreatePermissionReq) returns (CreatePermissionResp);
  rpc UpdatePermission(UpdatePermissionReq) returns (UpdatePermissionResp);
  rpc DeletePermission(DeletePermissionReq) returns (DeletePermissionResp);

  // ---- 角色管理 ----
  rpc GetRole(GetRoleReq) returns (GetRoleResp);
  rpc ListRoles(ListRolesReq) returns (ListRolesResp);
  rpc CreateRole(CreateRoleReq) returns (CreateRoleResp);
  rpc UpdateRole(UpdateRoleReq) returns (UpdateRoleResp);
  rpc DeleteRole(DeleteRoleReq) returns (DeleteRoleResp);

  // ---- 菜单管理 ----
  rpc GetMenu(GetMenuReq) returns (GetMenuResp);
  rpc ListMenus(ListMenusReq) returns (ListMenusResp);
  rpc CreateMenu(CreateMenuReq) returns (CreateMenuResp);
  rpc UpdateMenu(UpdateMenuReq) returns (UpdateMenuResp);
  rpc DeleteMenu(DeleteMenuReq) returns (DeleteMenuResp);
  rpc GetMenuTreeByUserId(GetMenuTreeByUserIdReq) returns (GetMenuTreeByUserIdResp);
  rpc GetMenuTreeByRoleId(GetMenuTreeByRoleIdReq) returns (GetMenuTreeByRoleIdResp);

  // ---- 部门管理 ----
  rpc GetDept(GetDeptReq) returns (GetDeptResp);
  rpc ListDepts(ListDeptsReq) returns (ListDeptsResp);
  rpc CreateDept(CreateDeptReq) returns (CreateDeptResp);
  rpc UpdateDept(UpdateDeptReq) returns (UpdateDeptResp);
  rpc DeleteDept(DeleteDeptReq) returns (DeleteDeptResp);
  rpc GetDeptTreeByUserId(GetDeptTreeByUserIdReq) returns (GetDeptTreeByUserIdResp);

  // ---- 数据权限管理 ----
  rpc GetScope(GetScopeReq) returns (GetScopeResp);
  rpc ListScopes(ListScopesReq) returns (ListScopesResp);
  rpc CreateScope(CreateScopeReq) returns (CreateScopeResp);
  rpc UpdateScope(UpdateScopeReq) returns (UpdateScopeResp);
  rpc DeleteScope(DeleteScopeReq) returns (DeleteScopeResp);

  // ---- 角色-权限绑定 ----
  rpc AssignRolePerms(AssignRolePermsReq) returns (AssignRolePermsResp);
  rpc ListRolePerms(ListRolePermsReq) returns (ListRolePermsResp);
  rpc ClearRolePerms(ClearRolePermsReq) returns (ClearRolePermsResp);

  // ---- 角色-菜单绑定 ----
  rpc AssignRoleMenus(AssignRoleMenusReq) returns (AssignRoleMenusResp);
  rpc ListRoleMenus(ListRoleMenusReq) returns (ListRoleMenusResp);
  rpc ClearRoleMenus(ClearRoleMenusReq) returns (ClearRoleMenusResp);

  // ---- 菜单-权限绑定 ----
  rpc AssignMenuPerms(AssignMenuPermsReq) returns (AssignMenuPermsResp);
  rpc ListMenuPerms(ListMenuPermsReq) returns (ListMenuPermsResp);
  rpc ClearMenuPerms(ClearMenuPermsReq) returns (ClearMenuPermsResp);

  // ---- 用户-角色绑定 ----
  rpc AssignUserRoles(AssignUserRolesReq) returns (AssignUserRolesResp);
  rpc ListUserRoles(ListUserRolesReq) returns (ListUserRolesResp);
  rpc ClearUserRoles(ClearUserRolesReq) returns (ClearUserRolesResp);

  // ---- 用户-部门绑定 ----
  rpc AssignUserDepts(AssignUserDeptsReq) returns (AssignUserDeptsResp);
  rpc ListUserDepts(ListUserDeptsReq) returns (ListUserDeptsResp);
  rpc ClearUserDepts(ClearUserDeptsReq) returns (ClearUserDeptsResp);
}