# Prometheus 抓取配置(DS-A-22)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 后端指标:独立内部端口 :9002(compose 网络内可达,不映射宿主机)
  # A4 双实例:两个 target。Prometheus 会自动给时序打 instance label,
  # 所以 Grafana 里能按实例切片 —— 这是"两个实例都在干活"的可观测依据。
  # C 阶段服务变多后,这里升级为 file_sd(见 DS-A-26 一.4)。
  - job_name: demo-shop-backend
    static_configs:
      - targets: ["backend-1:9002", "backend-2:9002"]
