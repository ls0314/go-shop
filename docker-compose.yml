# 全栈一键编排:4 中间件 + 后端 + 前端
services:
  postgres:
    image: postgres:14-alpine
    # 调试期暴露宿主机端口;"纯部署"姿态可删掉 ports
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: demo_shop
    # DS-A-20 调试中确认:默认 100 上限会被并发连接打满,提到 300
    command: postgres -c max_connections=300
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  redis:
    image: redis:6-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-demoShop}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-demoShop}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-demoShop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-demoShop}
      RABBITMQ_DEFAULT_VHOST: demoShop
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    ports: [ "2379:2379", "2380:2380" ]
    command:
      - etcd
      - --name=etcd-node1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-node1=http://etcd:2380
      - --initial-cluster-state=new
    volumes: [ etcd-data:/etcd-data ]
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ demo-shop-network ]
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  # 对象存储:文件上传的落点。
  # 为什么不再用本地盘:单体时代靠 uploads-data 共享卷 + 双实例,那只在
  # 单机 compose 下成立;上 K8s / 多机后同一路径不再是同一块盘。
  #
  # ============================================================
  # 镜像来源:pgsty/minio(不是 minio/minio)
  # ============================================================
  #
  # 官方镜像两条路都堵死了(实测 "pull access denied ...
  # repository does not exist",不是网络问题):
  #   minio/minio      2025-10 起停止在 Docker Hub 分发
  #   bitnami/minio    2025-08 起不再免费提供(免费镜像迁往 bitnamilegacy)
  #
  # pgsty 是 Pigsty(知名 PostgreSQL 发行版项目)的镜像组织,收录在它的
  # registry 文档里;tag 跟随官方发版(现存 RELEASE.2026-*),国内多个
  # 镜像站也已收录,拉取成功率高于 quay.io。
  #
  # 信任边界:这仍是第三方镜像,未做 digest 校验。若在意供应链,应改从
  # quay.io 拉或自建。用的是 latest(官方文档给的拉取方式就是不带 tag);
  # 若要锁版本,先 `docker images pgsty/minio` 看有哪些 RELEASE.* 再回填。
  minio:
    image: pgsty/minio:latest
    ports: ["9000:9000", "9001:9001"]   # 9000 数据 / 9001 控制台
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-demoshop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demoshop123}
      # 关掉自动更新检查:它会往日志里刷外网请求失败的噪音
      MINIO_UPDATE: "off"
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  # ============ 双实例(A4):两个进程同时跑,跨进程共享状态才被真正检验 ============
  backend-1: &backend-base
    build:
      context: ./demo-shop-back
      args:
        GOPROXY: https://goproxy.cn,direct
    environment: &backend-env
      DEMO_SHOP_DB_HOST: postgres
      DEMO_SHOP_REDIS_ADDR: redis:6379
      DEMO_SHOP_REDIS_PASSWORD: ${REDIS_PASSWORD:-demoShop}
      DEMO_SHOP_RABBITMQ_DSN: amqp://demoShop:demoShop@rabbitmq:5672/demoShop
      DEMO_SHOP_ES_ADDRESSES: http://elasticsearch:9200
      DEMO_SHOP_JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      # 双实例必须不同,否则雪花 ID 碰撞(uk_order_no 会报错而非静默脏数据)
      DEMO_SHOP_SNOWFLAKE_WORKER_ID: "1"
      DEMO_SHOP_TRUSTED_PROXIES: 172.16.0.0/12
      # 种子只让 backend-1 加载:seed 走版本账本,两实例同时首启会并发抢同一批种子
      DEMO_SHOP_SEED_DIR: /app/db/seeds
      # 预扣闸门一键开关(压测 A/B 与生产熔断):false=闸门旁路,全量走 DB 双防线
      DEMO_SHOP_GATE_ENABLED: "true"
    depends_on:
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s   # 首次启动要跑迁移,别在迁移期间判死
    volumes: [uploads-data:/app/uploads]
    networks: [demo-shop-network]
    restart: always

  backend-2:
    <<: *backend-base
    environment:
      <<: *backend-env
      DEMO_SHOP_SNOWFLAKE_WORKER_ID: "2"
      # 不加载种子:backend-1 已跑完,这里只需复用(靠 depends_on 保证顺序)
      DEMO_SHOP_SEED_DIR: ""
    depends_on:
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
      rabbitmq:      { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      backend-1:     { condition: service_healthy }
    # 故意不映射宿主机端口:后端只经 nginx 对外。调试时临时加 "9001:9001"

  frontend:
    build:
      context: ./demo_shop_front
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    environment:
      # upstream 名(定义在 nginx.conf.template 中),不再是单个主机名
      BACKEND_UPSTREAM: backend_cluster
    depends_on:
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }
    ports: ["8080:80"]
    networks: [demo-shop-network]
    restart: always
    healthcheck:
      # 探自己是否在服务,不探上游:上游全挂时 nginx 仍应起来并返回 502,
      # 否则整个前端被标 unhealthy,反而看不清问题出在哪
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 可观测性(DS-A-22):指标抓取 + 可视化面板
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [demo-shop-network]
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafana-data:/var/lib/grafana]
    depends_on: [prometheus]
    networks: [demo-shop-network]
    restart: always

networks:
  demo-shop-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  uploads-data:
  minio-data:
  grafana-data:
  etcd-data: