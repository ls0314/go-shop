# 全栈一键编排:4 中间件 + 后端 + 前端
services:
  postgres:
    image: postgres:14-alpine
    # 调试期暴露宿主机端口;"纯部署"姿态可删掉 ports
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: demo_shop
    # DS-A-20 调试中确认:默认 100 上限会被并发连接打满,提到 300
    command: postgres -c max_connections=300
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  redis:
    image: redis:6-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-demoShop}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-demoShop}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-demoShop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-demoShop}
      RABBITMQ_DEFAULT_VHOST: demoShop
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    ports: [ "2379:2379", "2380:2380" ]
    command:
      - etcd
      - --name=etcd-node1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-node1=http://etcd:2380
      - --initial-cluster-state=new
    volumes: [ etcd-data:/etcd-data ]
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ demo-shop-network ]
    restart: always


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    profiles: ["observability"]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  # 对象存储:文件上传的落点。
  # 为什么不再用本地盘:单体时代靠 uploads-data 共享卷 + 双实例,那只在
  # 单机 compose 下成立;上 K8s / 多机后同一路径不再是同一块盘。
  #
  # ============================================================
  # 镜像来源:pgsty/minio(不是 minio/minio)
  # ============================================================
  #
  # 官方镜像两条路都堵死了(实测 "pull access denied ...
  # repository does not exist",不是网络问题):
  #   minio/minio      2025-10 起停止在 Docker Hub 分发
  #   bitnami/minio    2025-08 起不再免费提供(免费镜像迁往 bitnamilegacy)
  #
  # pgsty 是 Pigsty(知名 PostgreSQL 发行版项目)的镜像组织,收录在它的
  # registry 文档里;tag 跟随官方发版(现存 RELEASE.2026-*),国内多个
  # 镜像站也已收录,拉取成功率高于 quay.io。
  #
  # 信任边界:这仍是第三方镜像,未做 digest 校验。若在意供应链,应改从
  # quay.io 拉或自建。用的是 latest(官方文档给的拉取方式就是不带 tag);
  # 若要锁版本,先 `docker images pgsty/minio` 看有哪些 RELEASE.* 再回填。
  minio:
    image: pgsty/minio:latest
    ports: ["9000:9000", "9001:9001"]   # 9000 数据 / 9001 控制台
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-demoshop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demoshop123}
      # 关掉自动更新检查:它会往日志里刷外网请求失败的噪音
      MINIO_UPDATE: "off"
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [demo-shop-network]
    restart: always

  # ============================================================
  # 微服务:BFF + 四个后端(单体已于本阶段退役)
  # ============================================================
  #
  # 三条贯穿全段的约定:
  #
  #   ① **构建上下文是仓库根**(context: .),不是服务目录 ——
  #      各服务 import demo-shop/api/...,靠仓库根的 go.work 才编译得过。
  #      根级 .dockerignore 已排除 node_modules 等大目录。
  #
  #   ② **每个服务挂两份东西**:etc/<名>.docker.yaml → /app/etc/<名>.yaml
  #      (容器内地址),以及可能需要的 jwt_keys。
  #      配置挂错是关键故障来源,所以各镜像的入口脚本在启动前会检查
  #      "二进制在不在、配置在不在、配置里有没有残留 127.0.0.1"。
  #
  #   ③ **迁移用一次性容器**,服务 depends_on 它们 service_completed_successfully。
  #      注意:若库不存在,迁移失败会让整条链卡住 —— 库由
  #      docker/postgres-init 在数据卷初始化时建出(仅首次生效,见该文件说明)。

  migrate-user:
    build: { context: ., dockerfile: services/user/Dockerfile }
    # 覆盖镜像的 ENTRYPOINT:同一个镜像里既有主程序也有 cmd/migrate
    entrypoint: ["/app/bin/user-service-migrate"]
    command: ["-f", "etc/user.yaml"]
    volumes:
      - ./services/user/etc/user.docker.yaml:/app/etc/user.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [demo-shop-network]
    restart: "no"     # 一次性任务,失败就该显式失败而不是无限重启

  migrate-product:
    build: { context: ., dockerfile: services/product/Dockerfile }
    entrypoint: ["/app/bin/product-service-migrate"]
    command: ["-f", "etc/product.yaml"]
    volumes:
      - ./services/product/etc/product.docker.yaml:/app/etc/product.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [demo-shop-network]
    restart: "no"

  migrate-trade:
    build: { context: ., dockerfile: services/trade/Dockerfile }
    entrypoint: ["/app/bin/trade-service-migrate"]
    command: ["-f", "etc/trade.yaml"]
    volumes:
      - ./services/trade/etc/trade.docker.yaml:/app/etc/trade.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [demo-shop-network]
    restart: "no"

  migrate-marketing:
    build: { context: ., dockerfile: services/marketing/Dockerfile }
    entrypoint: ["/app/bin/marketing-service-migrate"]
    command: ["-f", "etc/marketing.yaml"]
    volumes:
      - ./services/marketing/etc/marketing.docker.yaml:/app/etc/marketing.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [demo-shop-network]
    restart: "no"

  user-service:
    build: { context: ., dockerfile: services/user/Dockerfile }
    volumes:
      - ./services/user/etc/user.docker.yaml:/app/etc/user.yaml:ro
      # 私钥:本服务**签发**令牌,四个服务里只有它需要私钥
      - ./jwt_keys:/app/jwt_keys:ro
    depends_on:
      etcd:           { condition: service_healthy }
      redis:          { condition: service_healthy }
      migrate-user:   { condition: service_completed_successfully }
    networks: [demo-shop-network]
    restart: always

  product-service:
    build: { context: ., dockerfile: services/product/Dockerfile }
    volumes:
      - ./services/product/etc/product.docker.yaml:/app/etc/product.yaml:ro
    depends_on:
      etcd:             { condition: service_healthy }
      redis:            { condition: service_healthy }
      migrate-product:  { condition: service_completed_successfully }
    networks: [demo-shop-network]
    restart: always

  marketing-service:
    build: { context: ., dockerfile: services/marketing/Dockerfile }
    volumes:
      - ./services/marketing/etc/marketing.docker.yaml:/app/etc/marketing.yaml:ro
    depends_on:
      etcd:               { condition: service_healthy }
      redis:              { condition: service_healthy }
      migrate-marketing:  { condition: service_completed_successfully }
    networks: [demo-shop-network]
    restart: always

  trade-service:
    build: { context: ., dockerfile: services/trade/Dockerfile }
    volumes:
      - ./services/trade/etc/trade.docker.yaml:/app/etc/trade.yaml:ro
    depends_on:
      etcd:             { condition: service_healthy }
      redis:            { condition: service_healthy }
      rabbitmq:         { condition: service_healthy }
      migrate-trade:    { condition: service_completed_successfully }
    networks: [demo-shop-network]
    restart: always

  bff:
    build: { context: ., dockerfile: services/bff/Dockerfile }
    ports: ["9003:9003"]
    volumes:
      - ./services/bff/etc/bff.docker.yaml:/app/etc/bff.yaml:ro
      # 公钥:BFF 只验签,签不出来(私钥在 user-service)
      - ./jwt_keys:/app/jwt_keys:ro
    depends_on:
      # 四个下游都得先注册到 etcd,BFF 才解析得到实例。
      # 这里只等"容器起来"而不等"服务健康" —— 四个服务都没有 healthcheck,
      # 而 BFF 的 rpc.Connect 是懒连接,启动顺序不影响它后续解析。
      - etcd
      - user-service
      - product-service
      - marketing-service
      - trade-service
    healthcheck:
      # 用 BFF 自己的公开健康端点(挂 Public 中间件,不需要令牌)
      test: ["CMD-SHELL", "wget -qO- http://localhost:9003/api/v1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [demo-shop-network]
    restart: always


  frontend:
    build:
      context: ./demo_shop_front
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    environment:
      # nginx 的 proxy_pass 目标。单体时代是 backend_cluster(两个单体实例),
      # 现在是**单个 BFF** —— nginx.conf.template 里的 upstream 已同步改名。
      BACKEND_UPSTREAM: bff
    depends_on:
      bff: { condition: service_healthy }
    ports: ["8080:80"]
    networks: [demo-shop-network]
    restart: always
    healthcheck:
      # 探自己是否在服务,不探上游:上游全挂时 nginx 仍应起来并返回 502,
      # 否则整个前端被标 unhealthy,反而看不清问题出在哪
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ============================================================
  # 可观测性(DS-A-22)。**默认不启动** —— 需要时显式带 profile:
  #   docker compose --profile observability up -d
  # ============================================================
  #
  # 为什么默认关掉:三个容器约占 2.5~3G 内存,而它们对"把服务跑起来"
  # 不是必需的:
  #   - product-service 的 ES.Addresses 留空即不启用搜索,商品搜索降级为
  #     直查 DB(见 services/product/etc/product.docker.yaml);
  #   - 指标端点仍在各服务上暴露,只是没人抓。
  #
  # 注意 elasticsearch 的定义**在文件上部**(挨着其余中间件),它同样
  # 挂了 observability profile。
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [demo-shop-network]
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafana-data:/var/lib/grafana]
    depends_on: [prometheus]
    networks: [demo-shop-network]
    restart: always

networks:
  demo-shop-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  # 对象存储:文件上传的落点(取代了单体时代的 uploads-data 共享卷)
  minio-data:
  grafana-data:
  etcd-data:
  # 仅 observability profile 用到(elasticsearch 服务定义在文件上部)
  elasticsearch-data: