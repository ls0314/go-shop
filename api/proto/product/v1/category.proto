syntax = "proto3";

package product.v1;

option go_package = "demo-shop/api/gen/product/v1;v1_productv1";

// 类目域。表的所有权在 product-service(sys_category)。
// 与商品同库,故商品查询可直接联类目取名称,不产生跨库 JOIN。

// Category 类目快照。
message Category {
  int64 category_id = 1;
  int64 parent_id = 2;
  string category_name = 3;
  // 层级 1-4
  int64 category_level = 4;
  // 路径枚举,如 0,1,5
  string category_path = 5;
  int64 sort_order = 6;
  string icon_url = 7;
  bool is_leaf = 8;
  bool is_visible = 9;
  // active / disabled
  string status = 10;
}

// CategoryListItem 类目列表项。
message CategoryListItem {
  int64 category_id = 1;
  int64 parent_id = 2;
  string category_name = 3;
  int64 category_level = 4;
  int64 sort_order = 5;
  bool is_leaf = 6;
  bool is_visible = 7;
  string status = 8;
}

// CategoryTreeNode 类目树节点。
message CategoryTreeNode {
  int64 category_id = 1;
  string category_name = 2;
  int64 category_level = 3;
  bool is_visible = 4;
  string status = 5;
  repeated CategoryTreeNode children = 6;
}

message CreateCategoryReq {
  Category category = 1;
}

message CreateCategoryResp {
  int64 category_id = 1;
  string category_path = 2;
  string error_msg = 3;
}

message GetCategoryReq {
  int64 category_id = 1;
}

message GetCategoryResp {
  Category category = 1;
  string error_msg = 2;
}

message GetCategoryListReq {
  int32 page = 1;
  int32 page_size = 2;
}

message GetCategoryListResp {
  repeated CategoryListItem items = 1;
  int64 total = 2;
  string error_msg = 3;
}

message GetCategoryChildrenReq {
  int64 parent_id = 1;
}

message GetCategoryChildrenResp {
  repeated CategoryListItem items = 1;
  string error_msg = 2;
}

message GetCategoryTreeReq {
  // 起始层级,1 表示从根开始
  int64 level = 1;
  bool include_disabled = 2;
}

message GetCategoryTreeResp {
  repeated CategoryTreeNode items = 1;
  string error_msg = 2;
}

// UpdateCategoryReq 局部更新。updates 为 JSON 对象文本(字段名 -> 值)。
message UpdateCategoryReq {
  int64 category_id = 1;
  string updates_json = 2;
}

// UpdateCategoryResp 返回合并后的完整对象,调用方无需再查一次。
message UpdateCategoryResp {
  Category category = 1;
  string error_msg = 2;
}

message DeleteCategoryReq {
  int64 category_id = 1;
}

message DeleteCategoryResp {
  string error_msg = 1;
}

// CategoryService 类目读写。
service CategoryService {
  rpc CreateCategory(CreateCategoryReq) returns (CreateCategoryResp);
  rpc GetCategory(GetCategoryReq) returns (GetCategoryResp);
  rpc GetCategoryList(GetCategoryListReq) returns (GetCategoryListResp);
  rpc GetCategoryChildren(GetCategoryChildrenReq) returns (GetCategoryChildrenResp);
  rpc GetCategoryTree(GetCategoryTreeReq) returns (GetCategoryTreeResp);
  rpc UpdateCategory(UpdateCategoryReq) returns (UpdateCategoryResp);
  rpc DeleteCategory(DeleteCategoryReq) returns (DeleteCategoryResp);
}
