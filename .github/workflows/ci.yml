name: CI

on:
  push:
  pull_request:

jobs:

  backend:
    name: Backend (build / vet per module)
    runs-on: ubuntu-latest
    strategy:

      fail-fast: false
      matrix:
        module:
          - api
          - services/bff
          - services/user
          - services/product
          - services/trade
          - services/marketing
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:

          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            ${{ matrix.module }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...


  workspace:
    name: Backend (workspace consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum

      - name: Verify workspace resolves
        run: go list -m all > /dev/null

  frontend:
    name: Frontend (type build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo_shop_front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo_shop_front/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
