syntax = "proto3";

package user.v1;

option go_package = "demo-shop/api/gen/user/v1;v1_userv1";

import "user/v1/permission.proto";

// AssignMenuPerms 全量替换菜单的权限绑定(先清空再写入)。
message AssignMenuPermsReq {
  int64 menu_id = 1;
  repeated int64 perm_ids = 2;
}

message AssignMenuPermsResp {
  string error_msg = 1;
}

message ListMenuPermsReq {
  int64 menu_id = 1;
}

message ListMenuPermsResp {
  repeated Permission items = 1;
  int64 total = 2;
  string error_msg = 3;
}

message ClearMenuPermsReq {
  int64 menu_id = 1;
}

message ClearMenuPermsResp {
  string error_msg = 1;
}
