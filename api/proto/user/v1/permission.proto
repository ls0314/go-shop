syntax = "proto3";

package user.v1;

option go_package = "demo-shop/api/gen/user/v1;v1_userv1";

import "user/v1/common.proto";

// Permission 权限点快照。
message Permission {
  int64 permission_id = 1;
  string permission_code = 2;
  string permission_name = 3;
  // api / menu / button
  string permission_type = 4;
  // GET / POST / PUT / DELETE,非 api 类型为空
  string request_method = 5;
  // 与 sys_permission.api_path 一致,带 /api/v1 前缀
  string api_path = 6;
  string description = 7;
  // 系统内置权限不可改、不可删
  bool is_system = 8;
}

message GetPermissionReq {
  int64 permission_id = 1;
}

message GetPermissionResp {
  Permission permission = 1;
  string error_msg = 2;
}

message ListPermissionsReq {
  int32 page = 1;
  int32 page_size = 2;
  // 为空表示不过滤
  string permission_type = 3;
}

message ListPermissionsResp {
  repeated Permission items = 1;
  int64 total = 2;
  string error_msg = 3;
}

message CreatePermissionReq {
  Permission permission = 1;
}

message CreatePermissionResp {
  Permission permission = 1;
  string error_msg = 2;
}

message UpdatePermissionReq {
  int64 permission_id = 1;
  repeated FieldUpdate updates = 2;
}

// UpdatePermissionResp.permission 返回合并后的完整对象,
// 调用方无需再查一次。
message UpdatePermissionResp {
  Permission permission = 1;
  string error_msg = 2;
}

message DeletePermissionReq {
  int64 permission_id = 1;
}

message DeletePermissionResp {
  string error_msg = 1;
}

// 判权数据源。调用方每次取数都经此获取,
// 是否缓存、缓存多久由调用方决定。

message ListPermCodesByUserIdReq {
  int64 user_id = 1;
}

message ListPermCodesByUserIdResp {
  // 无任何权限时返回空数组,不返回错误
  repeated string perm_codes = 1;
}

message ListPermCodesByApiReq {
  // 接口路径,与 sys_permission.api_path 一致,带 /api/v1 前缀
  string api_path = 1;
  // HTTP 方法,大写,与 sys_permission.request_method 一致
  string request_method = 2;
}

message ListPermCodesByApiResp {
  // 无权限码时返回空数组,不返回错误
  repeated string perm_codes = 1;
}

message GetPermVersionReq {}

message GetPermVersionResp {
  // 单调递增,初值为 0
  int64 version = 1;
}