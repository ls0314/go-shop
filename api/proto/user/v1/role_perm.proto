syntax = "proto3";

package user.v1;

option go_package = "demo-shop/api/gen/user/v1;v1_userv1";

import "user/v1/permission.proto";

// AssignRolePerms 全量替换角色的权限绑定(先清空再写入)。
message AssignRolePermsReq {
  int64 role_id = 1;
  repeated int64 perm_ids = 2;
}

message AssignRolePermsResp {
  string error_msg = 1;
}

message ListRolePermsReq {
  int64 role_id = 1;
}

message ListRolePermsResp {
  repeated Permission items = 1;
  int64 total = 2;
  string error_msg = 3;
}

message ClearRolePermsReq {
  int64 role_id = 1;
}

message ClearRolePermsResp {
  string error_msg = 1;
}
