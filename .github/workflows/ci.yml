name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (vet / build / test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-shop-back
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demo_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: demo-shop-back/go.mod
          cache-dependency-path: demo-shop-back/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (concurrency & idempotency, with race detector)
        run: go test ./tests -race -v -timeout 15m
        env:
          TEST_PG_HOST: localhost
          TEST_PG_PORT: "5432"
          TEST_PG_USER: postgres
          TEST_PG_PASSWORD: postgres

  frontend:
    name: Frontend (type build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo_shop_front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo_shop_front/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
